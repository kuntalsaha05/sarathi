version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sarathi-postgis
    restart: always
    environment:
      POSTGRES_USER: sarathi_admin
      POSTGRES_PASSWORD: sarathi_secure_password
      POSTGRES_DB: sarathi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: sarathi-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  core-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.optimizer
    container_name: sarathi-engine
    environment:
      - DATABASE_URL=postgresql://sarathi_admin:sarathi_secure_password@postgres:5432/sarathi_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OSRM_URL=http://osrm:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - backend

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: sarathi-gateway
    environment:
      - PORT=5000
      - ENGINE_URL=http://core-engine:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://sarathi_admin:sarathi_secure_password@postgres:5432/sarathi_db
    ports:
      - "5000:5000"
    depends_on:
      core-engine:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - backend

  tourist-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    ports:
      - "8080:80"
    profiles:
      - frontend

  b2b-console:
    build:
      context: .
      dockerfile: docker/Dockerfile.b2b
    ports:
      - "8081:80"
    profiles:
      - frontend

volumes:
  pgdata:
  redisdata:
