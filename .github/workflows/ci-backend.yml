name: CI - Core Engine

on:
  push:
    paths:
      - 'core-engine/**'
      - 'database/**'
  pull_request:
    paths:
      - 'core-engine/**'
      - 'database/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: pip install ruff && ruff check app tests || true

      - name: Run tests
        run: |
          pip install pytest pytest-asyncio
          pytest tests/ -v || true
